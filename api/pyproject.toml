[project]
name = "dsh-console-api"
version = "0.1.0"
description = "DSH cloud console control plane"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.35",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14,<1.15",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "pymysql>=1.1,<2",
  "cryptography>=43,<45",
  "redis>=5.2,<6",
  "argon2-cffi>=23.1,<24",
  "python-multipart>=0.0.12,<0.1",
  "email-validator>=2.2,<3",
  "httpx>=0.27,<0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.7,<0.9", "fakeredis>=2.26,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.routers", "app.services"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E501", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
