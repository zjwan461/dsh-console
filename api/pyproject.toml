[project]
name = "dsh-console-api"
# Read from app/version.py so the package metadata, the FastAPI app and
# /system/health can never disagree.
dynamic = ["version"]
description = "DSH cloud console control plane"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.35",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14,<1.15",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "pymysql>=1.1,<2",
  "cryptography>=43,<45",
  "redis>=5.2,<6",
  "argon2-cffi>=23.1,<24",
  "docker>=7.1,<8",
  "psutil>=6.1,<8",
  "zstandard>=0.23,<1",
  "python-multipart>=0.0.12,<0.1",
  "email-validator>=2.2,<3",
  "httpx>=0.27,<0.29",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
# Pinned: the linter's rule set changes between releases, and "green locally, red
# in CI" is always a version skew. CI installs exactly this.
dev = ["pytest>=8.3,<9", "ruff==0.8.6", "fakeredis>=2.26,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.routers", "app.services"]

[tool.setuptools.dynamic]
version = { attr = "app.version.__version__" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
# `api/alembic` is a migrations directory, not an importable package root, but
# ruff would otherwise treat the name as first-party and split alembic's imports
# across two blocks.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E501", "I001"]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
