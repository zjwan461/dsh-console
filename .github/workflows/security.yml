name: security

# Two guards that matter for a public repository:
#   * no credentials, DSNs with passwords, or real host addresses in code/history
#   * dependency advisories are visible without blocking releases

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-secrets:
    name: no secrets or host addresses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan working tree
        run: python scripts/check_no_secrets.py
      - name: Scan full history
        run: python scripts/check_no_secrets.py --history

  dependency-audit:
    name: python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install api and audit tool
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pip-audit
      # Advisory only: a new CVE should be visible, not stop a release.
      - name: Audit installed dependencies
        continue-on-error: true
        run: pip-audit --progress-spinner off

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        continue-on-error: true
        run: npm audit --audit-level=high